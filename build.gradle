import java.text.SimpleDateFormat

plugins {
    id 'application'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
}

group = 'com.brasil.transparente.api'

def getVersionName = {
    def formatter = new SimpleDateFormat("yyyy.MM.dd-HHmm")
    formatter.setTimeZone(TimeZone.getTimeZone("America/Sao_Paulo"))
    def datePart = formatter.format(new Date())
    return "${datePart}"
}

version = getVersionName()
println "🛠️ Building version: ${project.version}"

kotlin {
    jvmToolchain(25)
}

jar {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Kotlin
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:9.7.0'

    // Google Cloud SQL
    implementation 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.29.0'

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

}

application {
    mainClass = 'com.brasil.transparente.api.BrasilTransparenteApiApplication'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.15'
}

def jacocoReportExclusions = [
        'com/brasil/transparente/api/BrasilTransparenteApiApplication*',
        'com/brasil/transparente/api/dto/**',
        'com/brasil/transparente/api/entity/**',
        'com/brasil/transparente/api/repository/**',
        'com/brasil/transparente/api/service/**'
]

def jacocoVerificationExclusions = [
        'com.brasil.transparente.api.BrasilTransparenteApiApplication*',
        'com.brasil.transparente.api.dto.*',
        'com.brasil.transparente.api.entity.*',
        'com.brasil.transparente.api.repository.*',
        'com.brasil.transparente.api.service.*'
]

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: jacocoReportExclusions)
    }))

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = jacocoVerificationExclusions

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
