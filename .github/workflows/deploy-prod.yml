name: Deploy Pipeline - Prod
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy (default: main)"
        required: false
        default: "main"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: gradle
      - name: Build application
        run: ./gradlew clean build -x test
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
      - name: Build Docker image
        run: |
          gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT }}" \
            --tag gcr.io/${{ secrets.GCP_PROJECT }}/brasil-transparente-api:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy brasil-transparente-api \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/brasil-transparente-api:${{ github.sha }} \
            --region="${{ secrets.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=3 \
            --concurrency=80 \
            --set-secrets DB_JDBC_URL=DB_JDBC_URL:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest